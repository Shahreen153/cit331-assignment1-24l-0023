<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#31104b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c0519;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spotlight1" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="spotlight2" x1="100%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bgGrad)" />
  <!-- Spotlights -->
  <polygon points="100,0 250,450 50,450" fill="url(#spotlight1)" />
  <polygon points="700,0 750,450 550,450" fill="url(#spotlight2)" />
  <!-- Confetti / Party Sparkles -->
  <circle cx="180" cy="120" r="4" fill="#fbbf24" />
  <circle cx="260" cy="90" r="5" fill="#f43f5e" />
  <circle cx="620" cy="140" r="4" fill="#38bdf8" />
  <circle cx="540" cy="80" r="6" fill="#a855f7" />
  <rect x="220" y="160" width="8" height="8" transform="rotate(25 220 160)" fill="#fbbf24" />
  <rect x="580" y="180" width="8" height="8" transform="rotate(45 580 180)" fill="#34d399" />
  <!-- Stage & Crowd Silhouette -->
  <path d="M0 380 Q200 360 400 370 T800 380 L800 450 L0 450 Z" fill="#0f0e17" />
  <g fill="#181824">
    <!-- Crowd heads and arms raised -->
    <circle cx="100" cy="385" r="16" />
    <circle cx="140" cy="375" r="18" />
    <circle cx="190" cy="380" r="15" />
    <circle cx="250" cy="365" r="20" />
    <circle cx="310" cy="375" r="17" />
    <circle cx="370" cy="360" r="22" />
    <circle cx="430" cy="365" r="19" />
    <circle cx="490" cy="370" r="21" />
    <circle cx="550" cy="360" r="20" />
    <circle cx="610" cy="375" r="18" />
    <circle cx="670" cy="368" r="22" />
    <circle cx="730" cy="380" r="16" />
  </g>
  <!-- Text Overlay -->
  <text x="400" y="220" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ANNUAL CAMPUS GALA &amp; YOUTH FEST 2026</text>
  <text x="400" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#f472b6" text-anchor="middle">Live Performances · Cultural Showcases · Food Street · Awards</text>
</svg>
